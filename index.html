<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>GORK OS • Pump & Rug Supreme</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a12;
      --accent: #fef08a;
      --text: #fff;
      --text-dark: #111;
      --win-bg: rgba(0,0,16,.95);
      --bar-bg: rgba(0,0,0,.7);
      --dock-bg: rgba(0,0,0,.6);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body {
      width:100%;height:100%;overflow:hidden;
      background: var(--bg) url('assets/gork hands.jpg') bottom right no-repeat;
      background-size: contain;
      font-family:'Press Start 2P',monospace;color:var(--text);
    }
    .gork-logo-top {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 120px;
      height: auto;
      z-index: 9999;
    }
    .gork-logo-bottom {
      position: absolute;
      bottom: 10px;
      right: 10px;
      width: 80px;
      height: auto;
      z-index: 9999;
    }
    .title {
      position: absolute;
      top: 20px;
      left: 140px;
      font-size: 10px;
      color: var(--accent);
      z-index: 9999;
    }
    .desktop {
      position: absolute;
      top: 80px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .icon {
      text-align: center;
      cursor: pointer;
      user-select: none;
    }
    .emoji {
      font-size: 40px;
      filter: drop-shadow(0 0 8px var(--accent)) saturate(200%);
      transition: 0.15s;
    }
    .icon:hover .emoji {
      transform: translateY(-4px) scale(1.1);
      filter: drop-shadow(0 0 20px var(--accent));
    }
    .icon label {
      display: block;
      font-size: 10px;
      margin-top: 6px;
      text-shadow: 0 0 4px rgba(0,0,0,0.7);
    }
    .window {
      display: none;
      position: absolute;
      top: 150px;
      left: 200px;
      width: 300px;
      height: 180px;
      background: var(--win-bg);
      border: 2px solid var(--accent);
      color: var(--text);
      padding: 8px;
      font-size: 10px;
      z-index: 1000;
    }
    .window.active {
      display: block;
    }
  </style>
</head>
<body>
  <img src="assets/gork os.jpg" class="gork-logo-top" alt="GORK OS Logo Top">
  <img src="assets/gork os.jpg" class="gork-logo-bottom" alt="GORK OS Logo Bottom">
  <h1 class="title">Welcome to GORK OS • Pump & Rug Supreme</h1>

  <div class="desktop">
    <div class="icon" onclick="toggleWindow('win-pump')"><div class="emoji">🚀</div><label>PUMP</label></div>
    <div class="icon" onclick="toggleWindow('win-rug')"><div class="emoji">📉</div><label>RUG</label></div>
    <div class="icon" onclick="toggleWindow('win-meme')"><div class="emoji">🦈</div><label>MEMES</label></div>
    <div class="icon" onclick="toggleWindow('win-tweets')"><div class="emoji">🐦</div><label>TWTS</label></div>
    <div class="icon" onclick="toggleWindow('win-nfts')"><div class="emoji">🖼️</div><label>NFTS</label></div>
    <div class="icon" onclick="toggleWindow('win-chat')"><div class="emoji">💬</div><label>CHAT</label></div>
    <div class="icon" onclick="toggleWindow('win-gas')"><div class="emoji">⛽</div><label>GAS</label></div>
    <div class="icon" onclick="toggleWindow('win-ticker')"><div class="emoji">📈</div><label>TICKER</label></div>
  </div>

  <div class="window" id="win-pump">🚀 Pump window loaded.</div>
  <div class="window" id="win-rug">📉 Rug pull incoming!</div>
  <div class="window" id="win-meme">🦈 Meme board open.</div>
  <div class="window" id="win-tweets">🐦 Viewing tweets...</div>
  <div class="window" id="win-nfts">🖼️ NFT drop list.</div>
  <div class="window" id="win-chat">💬 Chat interface.</div>
  <div class="window" id="win-gas">⛽ Gas prices surging.</div>
  <div class="window" id="win-ticker">📈 Real-time ticker data.</div>

  <script>
    function toggleWindow(id) {
      const win = document.getElementById(id);
      win.classList.toggle('active');
    }
  </script>
</body>
</html>
