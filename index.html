<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SimpleFakeDesktop</title>
  <style>
    /* FULLSCREEN & RESET */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* DESKTOP BACKGROUND */
    .desktop {
      position: relative;
      width: 100%;
      height: 100%;
      background: #2b2b2b; /* solid dark gray */
      background-size: cover;
    }

    /* ICONS */
    .icon {
      width: 80px;
      text-align: center;
      color: #ddd;
      margin: 16px;
      cursor: pointer;
      float: left;
      user-select: none;
    }
    .icon img {
      width: 48px;
      height: 48px;
      display: block;
      margin: 0 auto;
    }
    .icon div {
      margin-top: 4px;
      font-size: 14px;
    }

    /* TASKBAR */
    .taskbar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 32px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      line-height: 32px;
      padding-left: 12px;
      box-sizing: border-box;
    }

    /* WINDOWS */
    .window {
      position: absolute;
      width: 300px;
      height: 200px;
      background: #fff;
      border: 1px solid #444;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.5);
      display: none;
      flex-direction: column;
    }
    .window .titlebar {
      background: #444;
      color: #fff;
      padding: 6px;
      cursor: move;
      user-select: none;
      font-size: 14px;
    }
    .window .content {
      padding: 8px;
      flex: 1;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="desktop">
    <!-- Icon 1 -->
    <div class="icon" data-window="win1">
      <img src="https://img.icons8.com/fluency/48/000000/console.png" alt="Terminal">
      <div>Terminal</div>
    </div>
    <!-- Icon 2 -->
    <div class="icon" data-window="win2">
      <img src="https://img.icons8.com/fluency/48/000000/globe.png" alt="Browser">
      <div>Browser</div>
    </div>
  </div>

  <div class="taskbar">SimpleFakeDesktop</div>

  <!-- Window 1 -->
  <div id="win1" class="window" style="top: 50px; left: 50px;">
    <div class="titlebar">Terminal</div>
    <div class="content">
      <pre>> echo "Hello, world!"</pre>
    </div>
  </div>

  <!-- Window 2 -->
  <div id="win2" class="window" style="top: 100px; left: 150px;">
    <div class="titlebar">Browser</div>
    <div class="content">
      <p>This is a fake browser window.</p>
    </div>
  </div>

  <script>
    // Toggle windows on double-click
    document.querySelectorAll('.icon').forEach(icon => {
      icon.addEventListener('dblclick', () => {
        const win = document.getElementById(icon.dataset.window);
        win.style.display = win.style.display === 'flex' ? 'none' : 'flex';
      });
    });

    // Make windows draggable
    document.querySelectorAll('.window').forEach(win => {
      const bar = win.querySelector('.titlebar');
      bar.addEventListener('mousedown', e => {
        let shiftX = e.clientX - win.getBoundingClientRect().left;
        let shiftY = e.clientY - win.getBoundingClientRect().top;

        function onMouseMove(e) {
          win.style.left = e.clientX - shiftX + 'px';
          win.style.top = e.clientY - shiftY + 'px';
        }

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', () => {
          document.removeEventListener('mousemove', onMouseMove);
        }, { once: true });
      });
      bar.ondragstart = () => false;
    });
  </script>
</body>
</html>
