<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>BrainrotOS • Pump & Rug Deluxe</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing:border-box; margin:0; padding:0 }
    html, body {
      width:100%; height:100%; overflow:hidden;
      background:#0a0a12 url('https://source.unsplash.com/1600x900/?cyberpunk,grid') center/cover no-repeat;
      font-family:'Press Start 2P',monospace; color:#0ff; cursor:crosshair;
    }
    .desktop { position:relative; width:100%; height:100% }
    .icon {
      width:72px; text-align:center; float:left; margin:20px;
      transition:transform .15s; user-select:none; cursor:pointer;
    }
    .emoji {
      font-size:48px; line-height:1;
      filter:drop-shadow(0 0 12px #0ff) saturate(200%);
      transition:filter .15s,transform .15s;
    }
    .icon:hover .emoji,
    .icon.active .emoji {
      transform:translateY(-4px) scale(1.1);
      filter:drop-shadow(0 0 20px #0ff) saturate(250%);
    }
    .icon label {
      display:block; margin-top:6px; font-size:10px;
      text-shadow:0 0 4px rgba(0,0,0,.7);
    }
    .dock {
      position:absolute; bottom:48px; left:50%; transform:translateX(-50%);
      background:rgba(0,0,0,.6); padding:6px 12px; border-radius:16px;
      display:flex; gap:12px;
    }
    .dock .icon { width:40px }
    .dock .emoji { font-size:32px }
    .dock .icon:hover .emoji,
    .dock .icon.active .emoji { transform:scale(1.2) }
    .taskbar {
      position:absolute; bottom:0; left:0; width:100%; height:40px;
      background:rgba(0,0,0,.7); display:flex; align-items:center;
      padding:0 16px; font-size:10px;
    }
    .taskbar .clock { margin-left:auto; text-shadow:0 0 4px rgba(0,0,0,.7) }
    .music-control {
      position:absolute; bottom:48px; left:16px; z-index:999;
    }
    .music-control button {
      font-family:'Press Start 2P'; font-size:10px; padding:4px 8px;
      background:#0ff; color:#000; border:1px solid #0cc;
      cursor:pointer; box-shadow:0 0 8px #0ff;
    }
    .window {
      position:absolute; display:none; flex-direction:column;
      width:400px; height:260px; background:rgba(0,0,16,.95);
      border:2px solid #0ff; box-shadow:0 0 16px #0ff;
      overflow:hidden; z-index:1000;
    }
    .titlebar {
      background:#0ff; color:#111; padding:6px 10px;
      display:flex; justify-content:space-between; align-items:center;
      cursor:move; font-size:10px;
    }
    .titlebar .close {
      background:none; border:none; font-size:12px; cursor:pointer;
    }
    .content {
      flex:1; padding:8px; overflow:auto; font-size:10px; line-height:1.3;
    }
    .terminal {
      background:#000; color:#0f0; font-family:monospace;
      padding:8px; height:100%; overflow:auto;
    }
    iframe, .content img {
      width:100%; height:100%; object-fit:contain; border:none;
    }
    input, button { font-family:'Press Start 2P'; font-size:10px }
  </style>
</head>
<body>

  <div class="desktop">
    <!-- Desktop Icons -->
    <div class="icon" data-win="win-pump"><div class="emoji">🚀</div><label>PUMP.FUN</label></div>
    <div class="icon" data-win="win-rug"><div class="emoji">📉</div><label>RUG PULL</label></div>
    <div class="icon" data-win="win-meme"><div class="emoji">🦈</div><label>MEMES</label></div>
    <div class="icon" data-win="win-tweets"><div class="emoji">🐦</div><label>CRYPTO TWTS</label></div>
    <div class="icon" data-win="win-nft"><div class="emoji">🖼️</div><label>NFT DROPS</label></div>
    <div class="icon" data-win="win-zoom"><div class="emoji">💬</div><label>ZOOMER CHAT</label></div>
    <div class="icon" data-win="win-gas"><div class="emoji">⛽</div><label>GAS TRACKER</label></div>
    <div class="icon" data-win="win-whale"><div class="emoji">🐳</div><label>WHALE WATCH</label></div>
    <div class="icon" data-win="win-dex"><div class="emoji">📊</div><label>DEX SCREENER</label></div>
    <div class="icon" data-win="win-fud"><div class="emoji">📟</div><label>FUD METER</label></div>
    <div class="icon" data-win="win-ticker"><div class="emoji">📈</div><label>TICKER</label></div>
    <div class="icon" data-win="win-music"><div class="emoji">🎵</div><label>MUSIC</label></div>

    <!-- Dock -->
    <div class="dock">
      <div class="icon" data-win="win-pump"><div class="emoji">🚀</div></div>
      <div class="icon" data-win="win-meme"><div class="emoji">🦈</div></div>
      <div class="icon" data-win="win-rug"><div class="emoji">📉</div></div>
      <div class="icon" data-win="win-whale"><div class="emoji">🐳</div></div>
      <div class="icon" data-win="win-ticker"><div class="emoji">📈</div></div>
    </div>
  </div>

  <!-- Taskbar -->
  <div class="taskbar">
    BrainrotOS Pump & Rug Deluxe
    <div class="clock">00:00</div>
  </div>

  <!-- Music Control -->
  <div class="music-control">
    <button onclick="startMusic()">🎵 Play Music</button>
  </div>
  <iframe id="bgmusic" allow="autoplay"
          style="position:absolute;width:0;height:0;opacity:0;border:0;"></iframe>

  <!-- WINDOWS (all absolute, no inline coords) -->
  <div id="win-pump"    class="window"> … </div>
  <div id="win-rug"     class="window"> … </div>
  <div id="win-meme"    class="window"> … </div>
  <div id="win-tweets"  class="window"> … </div>
  <div id="win-nft"     class="window"> … </div>
  <div id="win-zoom"    class="window"> … </div>
  <div id="win-gas"     class="window"> … </div>
  <div id="win-whale"   class="window"> … </div>
  <div id="win-dex"     class="window"> … </div>
  <div id="win-fud"     class="window"> … </div>
  <div id="win-ticker"  class="window"> … </div>
  <div id="win-music"   class="window"> … </div>

  <script>
    // window positions map—right column for dex/fud/ticker
    const positions = {
      'win-pump':   { top:'100px',  left:'20px'  },
      'win-rug':    { top:'100px',  left:'450px' },
      'win-meme':   { top:'360px',  left:'20px'  },
      'win-tweets': { top:'360px',  left:'450px' },
      'win-nft':    { top:'620px',  left:'20px'  },
      'win-zoom':   { top:'620px',  left:'450px' },
      'win-gas':    { top:'880px',  left:'20px'  },
      'win-whale':  { top:'880px',  left:'450px' },
      'win-dex':    { top:'100px',  left:'880px' },
      'win-fud':    { top:'360px',  left:'880px' },
      'win-ticker': { top:'620px',  left:'880px' },
      'win-music':  { top:'880px',  left:'880px' }
    };

    // clock
    setInterval(()=>{
      const d=new Date(),
            h=('0'+d.getHours()).slice(-2),
            m=('0'+d.getMinutes()).slice(-2);
      document.querySelector('.clock').textContent=`${h}:${m}`;
    },1000);

    // autoplay background music
    function startMusic(){
      document.getElementById('bgmusic').src =
        'https://www.youtube.com/embed/DnxG7Qdghj0?autoplay=1&loop=1&playlist=DnxG7Qdghj0&controls=0';
      document.querySelector('.music-control').style.display='none';
    }
    window.addEventListener('load',  startMusic);
    document.body.addEventListener('click', startMusic, { once:true });

    // icon → window toggle + position
    document.querySelectorAll('.icon').forEach(ic=>{
      ic.onclick=()=>{
        const win=document.getElementById(ic.dataset.win);
        if(!win)return;
        const pos=positions[win.id];
        win.style.top  = pos.top;
        win.style.left = pos.left;
        const open=win.style.display==='flex';
        win.style.display=open?'none':'flex';
        ic.classList.toggle('active',!open);
      };
    });

    // close buttons
    document.querySelectorAll('.close').forEach(b=>{
      b.onclick=()=>{
        const w=b.closest('.window');
        w.style.display='none';
        document.querySelector(`.icon[data-win="${w.id}"]`)
                .classList.remove('active');
      };
    });

    // draggable windows
    document.querySelectorAll('.window').forEach(win=>{
      const bar=win.querySelector('.titlebar');
      bar.onmousedown=e=>{
        const r=win.getBoundingClientRect(),
              offX=e.clientX-r.left, offY=e.clientY-r.top;
        function mv(ev){
          win.style.left=ev.clientX-offX+'px';
          win.style.top=ev.clientY-offY+'px';
        }
        document.addEventListener('mousemove',mv);
        document.addEventListener('mouseup',()=>{
          document.removeEventListener('mousemove',mv);
        },{once:true});
      };
      bar.ondragstart=()=>false;
    });

    // manual YT load in music window
    function playYT(){
      const id=document.getElementById('yt-id').value.trim();
      document.getElementById('music-iframe').src=
        `https://www.youtube.com/embed/${id}?autoplay=1&loop=1&playlist=${id}&controls=1`;
    }
  </script>
</body>
</html>
