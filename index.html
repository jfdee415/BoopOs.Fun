<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>POPE OS • His Holiness Deluxe</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #fdf6e3;
      --accent: #ffd700;
      --text: #111;
      --text-dark: #111;
      --win-bg: rgba(255,255,255,0.95);
      --bar-bg: rgba(0,0,0,0.7);
      --dock-bg: rgba(0,0,0,0.6);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: linear-gradient(to bottom, #fffbe6, #fdf6e3);
      font-family: 'Press Start 2P', monospace;
      color: var(--text);
      cursor: url('https://cdn-icons-png.flaticon.com/512/1456/1456927.png'), auto;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(ellipse at top center, rgba(255,255,224,0.6), transparent);
      z-index: 0;
    }
    .title {
      position: absolute;
      top: 20px; left: 20px;
      font-size: 10px;
      color: var(--accent);
      background: rgba(0,0,0,0.5);
      padding: 4px 8px;
      border-radius: 4px;
      z-index: 9999;
    }
    .desktop {
      position: absolute;
      top: 80px; left: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding-left: 20px;
      z-index: 3;
    }
    .icon {
      text-align: center;
      cursor: pointer;
      user-select: none;
    }
    .emoji {
      font-size: 40px;
      filter: drop-shadow(0 0 8px var(--accent)) saturate(200%);
      transition: 0.15s;
    }
    .icon:hover .emoji {
      transform: translateY(-4px) scale(1.1);
      filter: drop-shadow(0 0 20px var(--accent));
    }
    .icon label {
      display: block;
      font-size: 10px;
      margin-top: 6px;
      text-shadow: 0 0 4px rgba(0,0,0,0.7);
    }
    .window {
      display: none;
      position: absolute;
      top: 150px; left: 200px;
      width: 300px; height: 180px;
      background: var(--win-bg);
      border: 2px solid var(--accent);
      color: var(--text-dark);
      padding: 8px;
      font-size: 10px;
      z-index: 1000;
      cursor: move;
      border-radius: 12px;
      box-shadow: 0 0 20px gold;
    }
    .window.active { display: block; }
    audio { display: none; }
    .angel, .dove {
      position: absolute;
      top: -50px;
      font-size: 40px;
      animation: floatDown 20s linear infinite;
      color: #fff;
      text-shadow: 0 0 6px gold;
    }
    .incense {
      position: absolute;
      width: 20px; height: 20px;
      background: radial-gradient(circle, white 20%, transparent 70%);
      animation: incenseRise 6s linear infinite;
      opacity: 0.5;
    }
    .quote {
      position: absolute;
      top: 0; right: 20px;
      color: #000;
      background: #fff8dc;
      padding: 8px;
      font-size: 9px;
      border: 1px solid gold;
      box-shadow: 0 0 10px gold;
      border-radius: 6px;
      z-index: 9999;
    }
    .blessing-popup {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #fffbe8;
      padding: 10px;
      border: 1px solid gold;
      border-radius: 8px;
      font-size: 10px;
      box-shadow: 0 0 10px gold;
      z-index: 9999;
      animation: fadeBless 5s ease-out forwards;
    }
    .trail {
      position: absolute;
      width: 12px;
      height: 12px;
      background: gold;
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 6px gold;
      animation: trailFade 1s ease-out forwards;
    }
    .halo {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 4px solid gold;
      box-shadow: 0 0 10px gold;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
    }
    @keyframes trailFade {
      to { opacity: 0; transform: scale(2); }
    }
    @keyframes fadeBless {
      0% { opacity: 0; }
      20% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes floatDown { to { top: 100%; } }
    @keyframes incenseRise {
      0% { bottom: 0; opacity: 0.2; transform: translateX(0); }
      100% { bottom: 100%; opacity: 0; transform: translateX(-40px); }
    }
  </style>
</head>
<body>
  <div class="halo"></div>
  <div class="quote">“Thou art the meme and the meme shall bless thee.” – Book of Gigachad 4:20</div>

  <script>
    // click trails
    document.addEventListener('click', e => {
      const trail = document.createElement('div');
      trail.className = 'trail';
      trail.style.left = e.pageX + 'px';
      trail.style.top = e.pageY + 'px';
      document.body.appendChild(trail);
      setTimeout(() => trail.remove(), 1000);
    });

    // divine confetti burst
    function confettiBurst() {
      for (let i = 0; i < 20; i++) {
        const part = document.createElement('div');
        part.className = 'trail';
        part.style.left = (window.innerWidth/2 + Math.random()*100 - 50) + 'px';
        part.style.top = (window.innerHeight/2 + Math.random()*100 - 50) + 'px';
        part.style.background = ['gold','white','#ffd700'][Math.floor(Math.random()*3)];
        document.body.appendChild(part);
        setTimeout(() => part.remove(), 1000);
      }
    }
    setInterval(confettiBurst, 8000);

    // blessing popup
    function showBlessing() {
      const msg = document.createElement('div');
      msg.className = 'blessing-popup';
      msg.textContent = '🙏 A papal blessing has been bestowed upon you.';
      document.body.appendChild(msg);
      setTimeout(() => msg.remove(), 5000);
    }
    setInterval(showBlessing, 15000);
  </script>
</body>
</html>
