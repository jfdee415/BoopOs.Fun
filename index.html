<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>BrainrotOS • Pump & Rug Deluxe</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a12;
      --accent: #00ffff;
      --text: #0ff;
      --text-dark: #111;
      --win-bg: rgba(0,0,16,.95);
      --bar-bg: rgba(0,0,0,.7);
      --dock-bg: rgba(0,0,0,.6);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body {
      width:100%;height:100%;overflow:hidden;
      background: var(--bg) url('https://source.unsplash.com/1600x900/?cyberpunk,grid') center/cover no-repeat;
      font-family:'Press Start 2P',monospace;color:var(--text);
    }
    /* ICONS */
    .desktop{position:relative;width:100%;height:100%;}
    .desktop .icon{width:64px;text-align:center;float:left;margin:16px;cursor:pointer;user-select:none;transition:.15s;}
    .emoji{font-size:40px;filter:drop-shadow(0 0 8px var(--accent)) saturate(200%);transition:.15s;}
    .icon:hover .emoji,
    .icon.active .emoji{transform:translateY(-4px) scale(1.1);filter:drop-shadow(0 0 20px var(--accent));}
    .icon label{display:block;font-size:10px;margin-top:6px;text-shadow:0 0 4px rgba(0,0,0,.7);}
    /* DOCK */
    .dock{position:absolute;bottom:48px;left:50%;transform:translateX(-50%);background:var(--dock-bg);padding:6px 12px;border-radius:16px;display:flex;gap:12px;}
    .dock .icon{width:36px;}
    .dock .emoji{font-size:28px;}
    /* TASKBAR */
    .taskbar{position:absolute;bottom:0;left:0;right:0;height:40px;background:var(--bar-bg);display:flex;align-items:center;padding:0 8px;gap:8px;font-size:10px;color:#fff;}
    .taskbar .clock{margin-left:auto;}
    .task-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);border-radius:4px;cursor:pointer;transition:.15s;color:#fff;}
    .task-btn.active{background:var(--accent);}
    /* WINDOWS */
    .window{position:absolute;display:none;flex-direction:column;width:400px;height:260px;background:var(--win-bg);border:2px solid var(--accent);box-shadow:0 0 16px var(--accent);overflow:hidden;z-index:1000;}
    .titlebar{background:var(--accent);color:var(--text-dark);padding:6px 10px;display:flex;justify-content:space-between;align-items:center;cursor:move;font-size:10px;}
    .titlebar .btn{background:none;border:none;font-size:12px;cursor:pointer;margin-left:6px;color:var(--text-dark);}
    .content{flex:1;padding:8px;overflow:auto;font-size:10px;line-height:1.3;}
    .terminal{background:#000;color:#0f0;font-family:monospace;}
    iframe,img,canvas{width:100%;height:100%;object-fit:contain;border:none;}
    input,button,select{font-family:'Press Start 2P';font-size:10px;}
    /* SCROLLING TICKER */
    .ticker-banner{position:absolute;bottom:40px;left:0;right:0;height:20px;background:rgba(0,0,0,.8);color:#fff;line-height:20px;white-space:nowrap;overflow:hidden;font-size:12px;}
    .ticker-banner div{display:inline-block;padding-left:100%;animation:scroll 15s linear infinite;}
    @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
    /* TOASTS */
    .toast{position:fixed;top:16px;right:16px;background:#222;color:#fff;padding:8px 12px;border-radius:4px;box-shadow:0 0 12px rgba(0,0,0,.5);opacity:0;animation:fadein .3s forwards,fadeout .3s 3s forwards;}
    @keyframes fadein{to{opacity:1}}@keyframes fadeout{to{opacity:0}}
    /* MAGA BANNER OVERRIDE */
    #maga-banner { z-index:10001; }
    /* Pump.fun Contract placeholder */
    #pumpCA {
      position:absolute;
      top:50%;left:50%;
      transform:translate(-50%,-50%);
      background:rgba(0,255,255,0.1);
      border:1px solid var(--accent);
      color:var(--text);
      padding:8px 12px;
      border-radius:4px;
      font-family:'Press Start 2P',monospace;
      font-size:12px;
      text-align:center;
      z-index:9999;
    }
    #pumpCA strong { color:var(--accent); }
  </style>
</head>
<body>

  <!-- 🌟 MAGA Banner -->
  <div id="maga-banner" style="
    position:fixed;top:0;left:0;width:100%;
    background:#bb0000;color:#fff;text-align:center;
    padding:6px 0;font-family:'Press Start 2P';font-size:12px;
  ">
    🇺🇸 Make Pump.fun Great Again! 🇺🇸
  </div>

  <!-- DESKTOP ICONS -->
  <div class="desktop">
    <!-- your existing icons… -->
  </div>

  <!-- DOCK -->
  <div class="dock">
    <!-- your existing dock icons… -->
  </div>

  <!-- TASKBAR -->
  <div class="taskbar" id="taskbar">
    BrainrotOS Pump & Rug Deluxe
    <div class="clock">00:00</div>
  </div>

  <!-- SCROLLING TICKER -->
  <div class="ticker-banner"><div id="tickerText">Loading prices…</div></div>

  <!-- TOASTS -->
  <div id="toasts"></div>

  <!-- HIDDEN MUSIC IFRAME -->
  <iframe id="bgmusic" allow="autoplay" style="position:absolute;width:0;height:0;opacity:0;border:0;"></iframe>

  <!-- WINDOWS -->
  <!-- your existing window markup… -->

  <!-- Pump.fun Contract placeholder -->
  <div id="pumpCA">
    <strong>Pump.fun Ca:</strong> <span id="pumpCAaddr">—</span>
  </div>

  <script>
    // … all your existing JavaScript …

    // === MAGA ICON + WINDOW INJECTION ===
    (function(){
      const desktop = document.querySelector('.desktop');
      const dock    = document.querySelector('.dock');

      // Create MAGA icon
      const magaIcon = document.createElement('div');
      magaIcon.className = 'icon';
      magaIcon.dataset.win = 'win-maga';
      magaIcon.innerHTML = `<div class="emoji">🧢</div><label>MAGA</label>`;
      desktop.append(magaIcon);
      dock.append(magaIcon.cloneNode(true));

      // Create MAGA window
      const magaWin = document.createElement('div');
      magaWin.id = 'win-maga';
      magaWin.className = 'window';
      magaWin.innerHTML = `
        <div class="titlebar">
          MAGA
          <button class="btn close">✕</button>
        </div>
        <div class="content" style="
          display:flex;align-items:center;justify-content:center;font-size:12px;
        ">
          <p>🇺🇸 Trump 2024 🇺🇸</p>
        </div>`;
      document.body.append(magaWin);

      // Wire open/close
      magaIcon.addEventListener('click', ()=>{
        magaWin.style.display='flex';
        magaWin.style.top='60px';
        magaWin.style.left='20px';
      });
      magaWin.querySelector('.close').addEventListener('click', ()=>{
        magaWin.style.display='none';
      });
    })();

    // === Pump.fun Ca update ===
    // once your token is live, update the address here:
    document.getElementById('pumpCAaddr').textContent = '3t7YAwiSJb2V5T261KeRKkeYbECEDgf1h9qjBtpUpump';
  </script>
</body>
</html>
