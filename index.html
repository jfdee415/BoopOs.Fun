<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>BrainrotOS • Pump & Rug Deluxe</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a12;
      --accent: #00ffff;
      --text: #0ff;
      --text-dark: #111;
      --win-bg: rgba(0,0,16,.95);
      --bar-bg: rgba(0,0,0,.7);
      --dock-bg: rgba(0,0,0,.6);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body {
      width:100%;height:100%;overflow:hidden;
      background: var(--bg) url('https://source.unsplash.com/1600x900/?cyberpunk,grid') center/cover no-repeat;
      font-family:'Press Start 2P',monospace;color:var(--text);
    }
    /* ----- ICONS ----- */
    .desktop{position:relative;width:100%;height:100%;}
    .icon{width:64px;text-align:center;float:left;margin:16px;cursor:pointer;user-select:none;transition:.15s;}
    .emoji{font-size:40px;filter:drop-shadow(0 0 8px var(--accent)) saturate(200%);transition:.15s;}
    .icon:hover .emoji,
    .icon.active .emoji{transform:translateY(-4px) scale(1.1);filter:drop-shadow(0 0 20px var(--accent));}
    .icon label{display:block;font-size:10px;margin-top:6px;text-shadow:0 0 4px rgba(0,0,0,.7);}
    /* ----- DOCK ----- */
    .dock{position:absolute;bottom:48px;left:50%;transform:translateX(-50%);background:var(--dock-bg);padding:6px 12px;border-radius:16px;display:flex;gap:12px;}
    .dock .icon{width:36px;}
    .dock .emoji{font-size:28px;}
    /* ----- TASKBAR ----- */
    .taskbar{position:absolute;bottom:0;left:0;right:0;height:40px;background:var(--bar-bg);display:flex;align-items:center;padding:0 8px;gap:8px;font-size:10px;}
    .taskbar .clock{margin-left:auto;}
    .task-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);border-radius:4px;cursor:pointer;transition:.15s;}
    .task-btn.active{background:var(--accent);}
    /* ----- WINDOWS ----- */
    .window{position:absolute;display:none;flex-direction:column;width:400px;height:260px;background:var(--win-bg);border:2px solid var(--accent);box-shadow:0 0 16px var(--accent);overflow:hidden;z-index:1000;}
    .titlebar{background:var(--accent);color:var(--text-dark);padding:6px 10px;display:flex;justify-content:space-between;align-items:center;cursor:move;font-size:10px;}
    .titlebar .btn{background:none;border:none;font-size:12px;cursor:pointer;margin-left:6px;color:var(--text-dark);}
    .content{flex:1;padding:8px;overflow:auto;font-size:10px;line-height:1.3;}
    .terminal{background:#000;color:#0f0;font-family:monospace;}
    iframe,img,canvas{width:100%;height:100%;object-fit:contain;border:none;}
    input,button,select{font-family:'Press Start 2P';font-size:10px;}
    /* ----- SCROLLING TICKER ----- */
    .ticker-banner{position:absolute;bottom:40px;left:0;right:0;height:20px;background:rgba(0,0,0,.8);color:#fff;line-height:20px;white-space:nowrap;overflow:hidden;font-size:12px;}
    .ticker-banner div{display:inline-block;padding-left:100%;animation:scroll 15s linear infinite;}
    @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
    /* ----- TOAST ----- */
    .toast{position:fixed;top:16px;right:16px;background:#222;color:#fff;padding:8px 12px;border-radius:4px;box-shadow:0 0 12px rgba(0,0,0,.5);opacity:0;animation:fadein .3s forwards,fadeout .3s 3s forwards;}
    @keyframes fadein{to{opacity:1}}@keyframes fadeout{to{opacity:0}}
  </style>
</head>
<body>

  <!-- DESKTOP ICONS -->
  <div class="desktop">
    <div class="icon" data-win="win-pump"><div class="emoji">🚀</div><label>PUMP.FUN</label></div>
    <div class="icon" data-win="win-rug"><div class="emoji">📉</div><label>RUG PULL</label></div>
    <div class="icon" data-win="win-meme"><div class="emoji">🦈</div><label>MEMES</label></div>
    <div class="icon" data-win="win-tweets"><div class="emoji">🐦</div><label>TWTS</label></div>
    <div class="icon" data-win="win-nft"><div class="emoji">🖼️</div><label>NFT DROPS</label></div>
    <div class="icon" data-win="win-zoom"><div class="emoji">💬</div><label>CHAT</label></div>
    <div class="icon" data-win="win-gas"><div class="emoji">⛽</div><label>GAS</label></div>
    <div class="icon" data-win="win-whale"><div class="emoji">🐳</div><label>WHALE</label></div>
    <div class="icon" data-win="win-dex"><div class="emoji">📊</div><label>DEX</label></div>
    <div class="icon" data-win="win-fud"><div class="emoji">📟</div><label>FUD</label></div>
    <div class="icon" data-win="win-ticker"><div class="emoji">📈</div><label>TICKER</label></div>
    <div class="icon" data-win="win-terminal"><div class="emoji">💻</div><label>TERM</label></div>
    <div class="icon" data-win="win-settings"><div class="emoji">⚙️</div><label>SETTINGS</label></div>
    <div class="icon" data-win="win-game"><div class="emoji">🕹️</div><label>GAME</label></div>
    <div class="icon" data-win="win-wallet"><div class="emoji">💰</div><label>WALLET</label></div>
    <div class="icon" data-win="win-calendar"><div class="emoji">🗓️</div><label>EVENTS</label></div>
    <div class="icon" data-win="win-music"><div class="emoji">🎵</div><label>MUSIC</label></div>
  </div>

  <!-- DOCK -->
  <div class="dock">
    <div class="icon" data-win="win-pump"><div class="emoji">🚀</div></div>
    <div class="icon" data-win="win-rug"><div class="emoji">📉</div></div>
    <div class="icon" data-win="win-meme"><div class="emoji">🦈</div></div>
    <div class="icon" data-win="win-whale"><div class="emoji">🐳</div></div>
    <div class="icon" data-win="win-ticker"><div class="emoji">📈</div></div>
  </div>

  <!-- TASKBAR -->
  <div class="taskbar" id="taskbar">
    BrainrotOS Pump & Rug Deluxe
    <div class="clock">00:00</div>
  </div>

  <!-- SCROLLING TICKER -->
  <div class="ticker-banner"><div id="tickerText">Loading prices…</div></div>

  <!-- TOAST CONTAINER -->

  <!-- HIDDEN MUSIC IFRAME -->
  <iframe id="bgmusic" allow="autoplay" style="position:absolute;width:0;height:0;opacity:0;border:0;"></iframe>

  <!-- WINDOWS -->
  <!-- Pump -->
  <div id="win-pump" class="window">
    <div class="titlebar">
      PUMP.FUN
      <div>
        <button class="btn minimize">➖</button>
        <button class="btn maximize">⛶</button>
        <button class="btn close">✕</button>
      </div>
    </div>
    <div class="content"><img src="images/pump.jpg" alt="Pump.fun"/></div>
  </div>
  <!-- Rug -->
  <div id="win-rug" class="window">
    <div class="titlebar">
      RUG PULL
      <div><button class="btn minimize">➖</button><button class="btn maximize">⛶</button><button class="btn close">✕</button></div>
    </div>
    <div class="content"><img src="images/rugpull.jpg" alt="Rug Pull"/></div>
  </div>
  <!-- Memes -->
  <div id="win-meme" class="window">
    <div class="titlebar">
      MEMES
      <div>
        <button class="btn rand-meme">↻</button>
        <button class="btn minimize">➖</button>
        <button class="btn maximize">⛶</button>
        <button class="btn close">✕</button>
      </div>
    </div>
    <div class="content"><img id="memeImg" src="images/brainrot.jpg" alt="Meme"/></div>
  </div>
  <!-- Tweets -->
  <div id="win-tweets" class="window">
    <div class="titlebar">
      TWTS
      <div><button class="btn minimize">➖</button><button class="btn maximize">⛶</button><button class="btn close">✕</button></div>
    </div>
    <div class="content terminal" id="tweetTerminal"></div>
  </div>
  <!-- NFT -->
  <div id="win-nft" class="window">
    <div class="titlebar">
      NFT DROPS
      <div><button class="btn minimize">➖</button><button class="btn maximize">⛶</button><button class="btn close">✕</button></div>
    </div>
    <div class="content" id="nftList"></div>
  </div>
  <!-- Chat -->
  <div id="win-zoom" class="window">
    <div class="titlebar">
      CHAT
      <div><button class="btn minimize">➖</button><button class="btn maximize">⛶</button><button class="btn close">✕</button></div>
    </div>
    <div class="content" id="zoomChat"></div>
  </div>
  <!-- Gas -->
  <div id="win-gas" class="window">
    <div class="titlebar">
      GAS
      <div><button class="btn refresh-gas">⟳</button><button class="btn minimize">➖</button><button class="btn maximize">⛶</button><button class="btn close">✕</button></div>
    </div>
    <div class="content">
      <p id="gasValue">Loading…</p>
      <div style="background:#333;height:10px;border-radius:4px;overflow:hidden;">
        <div id="gasBar" style="width:0%;height:100%;background:var(--accent);"></div>
      </div>
    </div>
  </div>
  <!-- Whale -->
  <div id="win-whale" class="window">
    <div class="titlebar">
      WHALE
      <div><button class="btn refresh-whale">⟳</button><button class="btn minimize">➖</button><button class="btn maximize">⛶</button><button class="btn close">✕</button></div>
    </div>
    <div class="content" id="whaleContent"></div>
  </div>
  <!-- DEX -->
  <div id="win-dex" class="window">
    <div class="titlebar">
      DEX
      <div><button class="btn minimize">➖</button><button class="btn maximize">⛶</button><button class="btn close">✕</button></div>
    </div>
    <div class="content"><img src="images/dex.jpg" alt="DEX"/></div>
  </div>
  <!-- FUD -->
  <div id="win-fud" class="window">
    <div class="titlebar">
      FUD
      <div><button class="btn minimize">➖</button><button class="btn maximize">⛶</button><button class="btn close">✕</button></div>
    </div>
    <div class="content"><img src="images/fud.jpg" alt="FUD"/></div>
  </div>
  <!-- Ticker -->
  <div id="win-ticker" class="window">
    <div class="titlebar">
      TICKER
      <div><button class="btn minimize">➖</button><button class="btn maximize">⛶</button><button class="btn close">✕</button></div>
    </div>
    <div class="content"><img src="images/ticker.jpg" alt="Ticker"/></div>
  </div>
  <!-- Terminal -->
  <div id="win-terminal" class="window">
    <div class="titlebar">
      TERM
      <div><button class="btn minimize">➖</button><button class="btn maximize">⛶</button><button class="btn close">✕</button></div>
    </div>
    <div class="content terminal">
      <div id="term-output"></div>
      <input id="term-input" placeholder="Type 'help'…" style="width:100%;border:none;background:#111;color:#0f0;padding:4px;"/>
    </div>
  </div>
  <!-- Settings -->
  <div id="win-settings" class="window">
    <div class="titlebar">
      SETTINGS
      <div><button class="btn minimize">➖</button><button class="btn maximize">⛶</button><button class="btn close">✕</button></div>
    </div>
    <div class="content">
      <p>Accent:</p><input type="color" id="accentPicker" value="#00ffff"/>
      <p>Wallpaper:</p><button id="bgToggle">Toggle</button>
      <p>Font:</p><select id="fontPicker">
        <option value="Press Start 2P">Press</option>
        <option value="Courier New">Courier</option>
        <option value="Arial">Arial</option>
      </select>
    </div>
  </div>
  <!-- Game (Snake) -->
  <div id="win-game" class="window">
    <div class="titlebar">
      GAME
      <div><button class="btn minimize">➖</button><button class="btn maximize">⛶</button><button class="btn close">✕</button></div>
    </div>
    <div class="content"><canvas id="snakeCanvas" width="400" height="260"></canvas></div>
  </div>
  <!-- Wallet -->
  <div id="win-wallet" class="window">
    <div class="titlebar">
      WALLET
      <div><button class="btn minimize">➖</button><button class="btn maximize">⛶</button><button class="btn close">✕</button></div>
    </div>
    <div class="content">
      <pre id="walletBalances">DOGE: 10000  
SHIB: 5000000</pre>
      <p>Send:</p>
      <input id="walletAddr" placeholder="0x…"/><input id="walletAmt" placeholder="amt"/><button id="walletSend">Send</button>
      <div id="walletLog" style="margin-top:8px;overflow:auto;max-height:80px;"></div>
    </div>
  </div>
  <!-- Calendar -->
  <div id="win-calendar" class="window">
    <div class="titlebar">
      EVENTS
      <div><button class="btn minimize">➖</button><button class="btn maximize">⛶</button><button class="btn close">✕</button></div>
    </div>

  </div>
  <!-- Music -->
  <div id="win-music" class="window">
    <div class="titlebar">
      MUSIC
      <div><button class="btn minimize">➖</button><button class="btn maximize">⛶</button><button class="btn close">✕</button></div>
    </div>
    <div class="content">
      <p>YouTube ID:</p><input id="yt-id" placeholder="DnxG7Qdghj0"/><button onclick="playYT()">Load</button>
      <iframe id="music-iframe" allow="autoplay" style="margin-top:8px;width:100%;height:128px;"></iframe>
    </div>
  </div>

  <script>
    // Toast helper
    function toast(txt){
      const t=document.createElement('div'); t.className='toast'; t.textContent=txt;
      document.getElementById('toasts').append(t);
      setTimeout(()=>t.remove(),3500);
    }

    // Clock
    setInterval(()=>{
      const d=new Date();
      document.querySelector('.clock').textContent = 
        String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    },1000);

    // Window toggles & taskbar
    const icons = document.querySelectorAll('.icon'), wins = document.querySelectorAll('.window'),
          taskbar = document.getElementById('taskbar');
    const positions = {
      win-pump:{top:'100px',left:'20px'}, win-rug:{top:'100px',left:'450px'},
      win-meme:{top:'360px',left:'20px'}, win-tweets:{top:'360px',left:'450px'},
      win-nft:{top:'620px',left:'20px'}, win-zoom:{top:'620px',left:'450px'},
      win-gas:{top:'880px',left:'20px'}, win-whale:{top:'880px',left:'450px'},
      win-dex:{top:'100px',left:'880px'}, win-fud:{top:'360px',left:'880px'},
      win-ticker:{top:'620px',left:'880px'}, win-music:{top:'880px',left:'880px'},
      win-terminal:{top:'1140px',left:'20px'}, win-settings:{top:'1140px',left:'450px'},
      win-game:{top:'1140px',left:'880px'}, win-wallet:{top:'1400px',left:'20px'},
      win-calendar:{top:'1400px',left:'450px'}
    };
    // build taskbar entries
    icons.forEach(ic=>{
      const id=ic.dataset.win;
      if(!document.getElementById(id))return;
      const btn=document.createElement('div');
      btn.className='task-btn'; btn.innerText=ic.querySelector('.emoji').textContent;
      btn.onclick=()=>toggleWin(id);
      taskbar.append(btn);
    });
    function toggleWin(id){
      const w=document.getElementById(id), pos=positions[id];
      const ico = document.querySelector(`.icon[data-win="${id}"] .emoji`).textContent;
      const tbBtn = [...taskbar.children].find(b=>b.innerText===ico);
      if(w.style.display!=='flex'){
        w.style.top=pos.top; w.style.left=pos.left; w.style.display='flex';
        tbBtn.classList.add('active');
      } else {
        w.style.display='none'; tbBtn.classList.remove('active');
      }
    }
    icons.forEach(ic=>ic.onclick=()=>toggleWin(ic.dataset.win));

    // close/min/max
    wins.forEach(win=>{
      win.querySelector('.close').onclick=()=>{
        win.style.display='none';
        toggleWin(win.id); // remove taskbar active
      };
      win.querySelector('.minimize').onclick=()=>{
        win.style.display='none';
        toggleWin(win.id);
      };
      win.querySelector('.maximize').onclick=()=>{
        if(win.dataset.max==='1'){
          win.style.top=win.dataset.ot; win.style.left=win.dataset.ol;
          win.style.width=win.dataset.ow; win.style.height=win.dataset.oh;
          win.dataset.max='0';
        } else {
          win.dataset.ot=win.style.top; win.dataset.ol=win.style.left;
          win.dataset.ow=win.style.width; win.dataset.oh=win.style.height;
          win.style.top='40px'; win.style.left='0';
          win.style.width='100%'; win.style.height='calc(100% - 40px)';
          win.dataset.max='1';
        }
      };
      // draggable
      const bar=win.querySelector('.titlebar');
      bar.onmousedown=e=>{
        const r=win.getBoundingClientRect(), dx=e.clientX-r.left, dy=e.clientY-r.top;
        function mv(ev){
          win.style.left=(ev.clientX-dx)+'px';
          win.style.top=(ev.clientY-dy)+'px';
        }
        document.addEventListener('mousemove',mv);
        document.addEventListener('mouseup',()=>document.removeEventListener('mousemove',mv),{once:true});
      };
      bar.ondragstart=()=>false;
    });

    // SCROLLING PRICE TICKER
    async function updateTicker(){
      try{
        const r=await fetch(
          'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=5&page=1&sparkline=false'
        );
        const d=await r.json();
        document.getElementById('tickerText').innerText =
          d.map(x=>`${x.symbol.toUpperCase()}: $${x.current_price}`).join('   •   ');
      }catch{}
    }
    updateTicker(); setInterval(updateTicker,60000);

    // GAS GAUGE
    async function updateGas(){
      const g=Math.floor(20+Math.random()*180);
      document.getElementById('gasValue').innerText=`${g} Gwei`;
      document.getElementById('gasBar').style.width = Math.min(g,200)/2+'%';
    }
    updateGas(); setInterval(updateGas,60000);
    document.querySelectorAll('.refresh-gas').forEach(b=>b.onclick=updateGas);

    // WHALE
    function updateWhale(){
      const moves=['5M SHIB → Pancake','10K DOGE → Pool','25 Ξ → UniSwap'];
      document.getElementById('whaleContent').innerHTML=
        `<p>🚨 WALLET moved:</p><ul>${moves.map(m=>`<li>${m}</li>`).join('')}</ul><p><em>just now</em></p>`;
    }
    updateWhale();
    document.querySelectorAll('.refresh-whale').forEach(b=>b.onclick=()=>{updateWhale(); toast('🦈 Whale Update');});

    // RANDOM MEME
    const memeURLs=[
      'images/brainrot.jpg',
      'images/meme2.jpg',
      'images/meme3.jpg'
    ];
    function newMeme(){
      const u=memeURLs[Math.floor(Math.random()*memeURLs.length)];
      document.getElementById('memeImg').src=u;
    }
    document.querySelectorAll('.rand-meme').forEach(b=>b.onclick=newMeme);

    // STATIC TWTS, NFT, CHAT
    document.getElementById('tweetTerminal').innerHTML =
      `<p>"$PEPE pump 300%" – @MoonChad</p>
       <p>"#FUD incoming?" – @HODLer99</p>
       <p>"Gas insane" – @OnChainZoomer</p>`;
    document.getElementById('nftList').innerHTML =
      `<ul>
         <li>PunkWolves – 5/20 @ 4PM UTC</li>
         <li>GalaxyGhz – 5/21 @ 8PM UTC</li>
         <li>DragonLoot – 5/22 @ 2PM UTC</li>
         <li>ZoomerHeads – 5/23 @ 12PM UTC</li>
       </ul>`;
    document.getElementById('zoomChat').innerHTML =
      `<p><strong>You:</strong> YOLO on $PUMP?</p>
       <p><strong>Peer:</strong> fr fr 🚀</p>
       <p><strong>You:</strong> gas fees hurt 😭</p>
       <p><strong>Peer:</strong> hold til rug 🤡</p>`;

    // TERMINAL
    const termOut=document.getElementById('term-output'), termIn=document.getElementById('term-input');
    const cmds={
      help:()=>`help,open pump,scan rug,pump,meme`,
      'open pump':()=>toggleWin('win-pump'),
      'scan rug':()=>toast('🔍 Scanned: SAFE ✅'),
      pump:()=>toast('🚀 Moon!'),
      meme:()=>newMeme()
    };
    termIn.onkeydown=e=>{
      if(e.key==='Enter'){
        const cmd=termIn.value.trim().toLowerCase();
        termOut.innerHTML+=`<p>> ${cmd}</p>`;
        (cmds[cmd]||(()=>termOut.innerHTML+=`<p>Unknown: ${cmd}</p>`))();
        termIn.value=''; termOut.scrollTop=1e9;
      }
    };

    // SETTINGS
    document.getElementById('accentPicker').oninput=e=>
      document.documentElement.style.setProperty('--accent',e.target.value);
    document.getElementById('bgToggle').onclick=()=>{
      const cur=getComputedStyle(document.body).backgroundImage;
      document.body.style.background=cur.includes('unsplash')?
        'var(--bg)':'var(--bg) url("https://source.unsplash.com/1600x900/?cyberpunk,grid") center/cover';
    };
    document.getElementById('fontPicker').onchange=e=>
      document.body.style.fontFamily=e.target.value;

    // SNAKE
    const c=document.getElementById('snakeCanvas'), ctx=c.getContext('2d'),
          cell=20, cols=20, rows=13;
    let snake=[{x:9,y:6}], dir={x:0,y:0}, food={};
    function placeFood(){food={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)};}
    function gameLoop(){
      const head={x:(snake[0].x+dir.x+cols)%cols,y:(snake[0].y+dir.y+rows)%rows};
      snake.unshift(head);
      if(head.x===food.x&&head.y===food.y){placeFood();toast('🍖');}
      else snake.pop();
      ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);
      const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
      ctx.fillStyle=accent;
      snake.forEach(s=>ctx.fillRect(s.x*cell,s.y*cell,cell-2,cell-2));
      ctx.fillRect(food.x*cell,food.y*cell,cell-2,cell-2);
    }
    placeFood(); setInterval(gameLoop,200);
    window.addEventListener('keydown',e=>{
      if(e.key==='ArrowUp')dir={x:0,y:-1};
      if(e.key==='ArrowDown')dir={x:0,y:1};
      if(e.key==='ArrowLeft')dir={x:-1,y:0};
      if(e.key==='ArrowRight')dir={x:1,y:0};
    });

    // WALLET
    const bal={DOGE:10000,SHIB:5000000};
    function refreshWallet(){
      document.getElementById('walletBalances').textContent=
        `DOGE: ${bal.DOGE}\nSHIB: ${bal.SHIB}`;
    }
    document.getElementById('walletSend').onclick=()=>{
      const a=document.getElementById('walletAddr').value, amt=Number(document.getElementById('walletAmt').value);
      if(!a||!amt){toast('❌');return;}
      bal.DOGE=Math.max(0,bal.DOGE-amt);
      document.getElementById('walletLog').innerHTML+=`<p>Sent ${amt} DOGE → ${a}</p>`;
      refreshWallet(); toast('✅');
    };
    refreshWallet();

    // CALENDAR
    const events=[
      {n:'PunkWolves',d:new Date('2025-05-20T16:00:00Z')},
      {n:'GalaxyGhz',d:new Date('2025-05-21T20:00:00Z')},
      {n:'DragonLoot',d:new Date('2025-05-22T14:00:00Z')},
      {n:'ZoomerHeads',d:new Date('2025-05-23T12:00:00Z')}
    ];
    function updateCal(){
      const now=new Date();
      document.getElementById('eventList').innerHTML=
        events.map(ev=>{
          const diff=ev.d-now, d=Math.floor(diff/86400000),h=Math.floor((diff%86400000)/3600000),m=Math.floor((diff%3600000)/60000);
          return `<p>${ev.n}: ${d}d ${h}h ${m}m</p>`;
        }).join('');
    }
    updateCal(); setInterval(updateCal,60000);

    // MUSIC
    function startMusic(){
      document.getElementById('bgmusic').src=
        'https://www.youtube.com/embed/DnxG7Qdghj0?autoplay=1&loop=1&playlist=DnxG7Qdghj0&controls=0';
      toast('🎵');
    }
    window.addEventListener('load',startMusic);
    document.body.addEventListener('click',startMusic,{once:true});
    function playYT(){
      const id=document.getElementById('yt-id').value.trim();
      document.getElementById('music-iframe').src=
        `https://www.youtube.com/embed/${id}?autoplay=1&loop=1&playlist=${id}&controls=1`;
    }
  </script>
</body>
</html>
